<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Eco² Agent Workflow technical portfolio by Jihwan Ryu" />
    <meta property="og:title" content="Eco² Technical Portfolio" />
    <meta property="og:description" content="Agent Workflow · Backend · Platform · AWS / Kubernetes" />
    <title>Eco² Technical Portfolio</title>
    <style>
      :root { color-scheme: dark; --bg:#080b0a; --ink:#f3f7f5; --muted:#9eaaa6; --green:#89d7bc; --blue:#72a7ff; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:Inter, Pretendard, system-ui, sans-serif; }
      main { min-height:100vh; max-width:1120px; margin:auto; padding:42px; display:flex; flex-direction:column; }
      header, footer { display:flex; justify-content:space-between; gap:24px; color:var(--muted); font-size:13px; letter-spacing:.08em; }
      section { flex:1; display:grid; align-content:center; justify-items:center; text-align:center; }
      h1 { margin:0; font-size:clamp(92px,18vw,210px); line-height:.8; letter-spacing:-.07em; }
      h1 span { color:var(--green); }
      .scope { margin:38px 0 0; color:var(--blue); font-weight:700; letter-spacing:.12em; }
      .summary { max-width:720px; margin:22px auto 0; color:var(--muted); font-size:17px; line-height:1.7; }
      nav { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:34px; }
      a { color:inherit; }
      .button { padding:13px 20px; border:1px solid #37534a; border-radius:7px; text-decoration:none; font-weight:700; }
      .button.primary { background:var(--green); border-color:var(--green); color:#07100d; }
      .button:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
      footer a { color:var(--muted); text-underline-offset:3px; }
      @media (max-width:640px) { main { padding:26px 22px; } header, footer { flex-direction:column; } .scope { font-size:12px; } }
    </style>
  </head>
  <body>
    <main>
      <header><strong>ECO² // PRODUCT-SCOPED AGENTIC SYSTEM</strong><span>TECHNICAL PORTFOLIO · 32 PAGES</span></header>
      <section>
        <h1>Eco<span>²</span></h1>
        <p class="scope">WEB / MOBILE · AGENT WORKFLOW · AWS / KUBERNETES</p>
        <p class="summary">긴 LLM 작업을 끝까지 전달하고자 실행·이벤트·복구를 제품 상태로 설계한 과정과 검증 경계를 담았습니다.</p>
        <nav aria-label="Portfolio files">
          <a class="button primary" href="./portfolio.pdf">PDF 열기</a>
          <a class="button" href="./portfolio.pdf" download>PDF 다운로드</a>
          <a class="button" href="https://mangowhoiscloud.github.io/portfolio/eco2/">Interactive Portfolio</a>
        </nav>
      </section>
      <footer>
        <span>Jihwan Ryu · Backend / Platform / Agent Workflow</span>
        <span><a href="https://github.com/eco2-team/backend">Backend</a> · <a href="https://github.com/eco2-team/frontend-workflow">Frontend</a></span>
      </footer>
    </main>
  </body>
</html>
